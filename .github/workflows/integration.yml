name: Integration

on:
  workflow_dispatch:
  schedule:
    # Roda às 04:00 UTC todos os dias (00:00 BRT)
    - cron: "0 4 * * *"

env:
  NODE_VERSION: "22.12.0"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  integration:
    name: integration tests (Postgres real)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/lex_test?schema=public"
      DIRECT_URL:  "postgresql://postgres:postgres@localhost:5432/lex_test?schema=public"
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "stub"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      REDIS_URL: "redis://localhost:6379"
      QDRANT_URL: "http://localhost:6333"
      STORAGE_BUCKET_DOCUMENTS: "documents"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prisma migrate deploy
      - run: npx prisma generate
      - name: Run integration tests
        run: npm run test:integration
