name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.12.0"
  NEXT_TELEMETRY_DISABLED: "1"
  # Stubs para o build não falhar por env. Não usamos serviços reais aqui;
  # apenas garantimos que tipos / build estático passem.
  DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres?schema=public"
  DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/postgres?schema=public"
  NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "stub-anon-key-for-build"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"
  REDIS_URL: "redis://localhost:6379"
  QDRANT_URL: "http://localhost:6333"
  QDRANT_COLLECTION: "lex_main"
  STORAGE_BUCKET_DOCUMENTS: "documents"

jobs:
  lint-typecheck-test-build:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

  e2e:
    name: e2e (Playwright)
    needs: lint-typecheck-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      # A imagem qdrant/qdrant é minimal (Debian) e NÃO inclui wget nem curl.
      # Healthcheck HTTP com wget falha com "wget: not found" e o job nunca inicia.
      # Usamos Perl (presente na imagem) para abrir TCP na porta 6333.
      qdrant:
        image: qdrant/qdrant:v1.11.3
        ports:
          - 6333:6333
        options: >-
          --health-cmd "perl -MIO::Socket::INET -e 'exit(IO::Socket::INET->new(PeerAddr=>\"127.0.0.1\",PeerPort=>6333,Proto=>\"tcp\",Timeout=>3)?0:1)'"
          --health-interval 5s
          --health-timeout 8s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Prisma generate
        run: npx prisma generate

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run Playwright E2E
        # Os tests E2E aqui rodam sem Supabase real (login bloqueado por design):
        # validam páginas públicas, redirecionamentos, security headers e endpoints de health.
        # Para suite com auth real, adicione um workflow `e2e-authed.yml` separado com
        # secrets do Supabase e um usuário de teste pré-provisionado.
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
